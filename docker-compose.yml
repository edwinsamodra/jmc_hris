services:
  mariadb:
    image: mariadb:12.3
    container_name: hris-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: ${DB_NAME:-jmc_hris}
      MARIADB_USER: ${DB_USER:-admin}
      MARIADB_PASSWORD: ${DB_PASSWORD:-jamurkembang}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Auto-run DDL schema & baseline seeds during first-time container initialization:
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hris-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Direct process.env
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jmc_hris}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-jamurkembang}
      # Nuxt runtimeConfig override environment variables (NUXT_DATABASE_*)
      NUXT_DATABASE_HOST: mariadb
      NUXT_DATABASE_PORT: 3306
      NUXT_DATABASE_NAME: ${DB_NAME:-jmc_hris}
      NUXT_DATABASE_USER: ${DB_USER:-admin}
      NUXT_DATABASE_PASSWORD: ${DB_PASSWORD:-jamurkembang}
      NUXT_PUBLIC_APP_NAME: ${APP_NAME:-"HRIS JMC"}
      NUXT_PUBLIC_APP_CLIENT: ${APP_CLIENT:-"JMC"}
      APP_NAME: ${APP_NAME:-"HRIS JMC"}
      APP_CLIENT: ${APP_CLIENT:-"JMC"}
      MAIL_USER: ${MAIL_USER:-""}
      MAIL_PASS: ${MAIL_PASS:-""}
      CLIENT_ID: ${CLIENT_ID:-""}
      CLIENT_SECRET: ${CLIENT_SECRET:-""}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-""}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-""}
      NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NUXT_PUBLIC_RECAPTCHA_SITE_KEY:-""}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - hris-network

volumes:
  mariadb_data:
    driver: local

networks:
  hris-network:
    driver: bridge
